<script>
(function() {
  try {
    var saved = localStorage.getItem('kit.theme');
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved ? saved : (sysDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>

*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}

 background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 45%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 10%,transparent 70%);opacity:.55}

.card{position:relative;width:100%;max-width:460px;min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:26px 24px 20px;
 backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 20px 60px -20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
 transition:opacity .25s,transform .25s;--mx:50%;--my:0%}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(249,171,0,.6)}70%{box-shadow:0 0 0 8px rgba(249,171,0,0)}100%{box-shadow:0 0 0 0 rgba(249,171,0,0)}}

.prog{margin:10px 0 2px}.prow{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted);margin-bottom:6px}

.sm{font:11.5px var(--mono);color:var(--muted);margin-top:6px}

#plabel-txt{cursor:pointer;width:fit-content;transition:color .12s}

.sel-desc{font:11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-chevron{width:16px;height:16px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.sel-open .sel-chevron{transform:rotate(180deg)}
.sel-popover{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--popover);border:1px solid var(--line2);border-radius:14px;padding:6px;
 backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 16px 40px -10px rgba(0,0,0,.65);z-index:60;display:none;flex-direction:column;gap:2px}
.sel-popover.open{display:flex}
.sel-popover-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sel-popover-title{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sel-close-btn{background:none;border:0;color:var(--muted);cursor:pointer;width:44px;height:44px;margin:-10px -10px -10px 0;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .12s}
.sel-close-btn:hover{color:var(--fg);background:rgba(127,127,127,.15)}
.sel-items{display:flex;flex-direction:column;gap:2px;max-height:min(56vh,420px);overflow-y:auto;overscroll-behavior:contain}
.sel-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background-color .12s}
.sel-item .sel-info{flex:1;min-width:0}
.sel-item .sel-title{-webkit-line-clamp:3;line-clamp:3}
.sel-item:hover{background:rgba(127,127,127,.15)}
.sel-item.active{background:rgba(249,171,0,.15);color:var(--fg)}
.sel-item-check{width:14px;height:14px;color:var(--y);opacity:0;flex-shrink:0}
.sel-item.active .sel-item-check{opacity:1}
/* StarBorder button */
.star{position:relative;display:block;width:100%;margin-top:18px;padding:1.5px;border-radius:15px;overflow:hidden;border:0;background:transparent;cursor:pointer}
.star::before,.star::after{content:"";position:absolute;width:300%;height:50%;border-radius:50%;opacity:.8;background:radial-gradient(circle,var(--n),transparent 12%);z-index:0}
.star::before{bottom:-12px;right:-250%;animation:sb 5s linear infinite alternate}.star::after{top:-12px;left:-250%;animation:st 5s linear infinite alternate}
@keyframes sb{0%{transform:translate(0)}100%{transform:translate(-100%);opacity:0}}@keyframes st{0%{transform:translate(0)}100%{transform:translate(100%);opacity:0}}
.star > span{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font-size:16px;font-weight:700;color:#0E0A12;
 background:linear-gradient(180deg,#FBBF24 0%,#D97706 100%);box-shadow:0 8px 30px -8px rgba(217,119,6,.5);transition:transform .15s,filter .15s}
.star:hover > span{filter:brightness(1.06)}.star:active > span{transform:scale(.985)}
.star[disabled]{cursor:default}.star[disabled] > span{background:rgba(127,127,127,.18);color:var(--muted);box-shadow:none}.star[disabled]::before,.star[disabled]::after{display:none}
#wicon{display:inline-flex;align-items:center;justify-content:center;line-height:0}

.btn-icon{width:18px;height:18px;flex-shrink:0}

@keyframes spin{to{transform:rotate(360deg)}}

.ghost:hover{border-color:var(--bad);color:var(--bad)}

/* shadcn Style Collapsible Console */

:root[data-theme=light] ::-webkit-scrollbar-thumb{background:rgba(15,23,42,.16)}

*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
:root[data-theme=light] *{scrollbar-color:rgba(15,23,42,.16) transparent}

@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

 .chip{display:none}

 .card{padding:20px 16px 14px;border-radius:20px}

 .sub{font-size:12.5px;max-width:none}

 .meta small{font-size:9.5px}.meta b{font-size:12.5px}

}

/* Fullscreen ComfyUI Iframe & Floating Dock */

.dock-inner{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;border-radius:9999px;

<body>

<header>

    </button>

</aside>
<script src="/_gate/static/bg.js" defer></script>
<script>
const $=id=>document.getElementById(id);
const I18N={
 en:{
  title:"Comfy Colab Kit",
  sleeping_title:"ComfyUI is sleeping",
  sleeping_sub:"GPU released — no compute units in use. Wake it to start a shared session.",
  sleeping_last_stop:"Last stop: {reason}. GPU released — no compute units in use.",

  elapsed:"Elapsed {time}",
  badge_sleeping:"Sleeping",badge_ready:"Ready",badge_failed:"Failed",badge_stopping:"Stopping",badge_switching:"Switching",badge_waking:"Waking",
  online:"{count} online",
  stage_allocating:"Allocate GPU",stage_installing:"Install runtime",stage_downloading:"Download models",stage_booting:"Start ComfyUI",stage_smoke_testing:"Smoke test",
  overall:"Overall",eta:"ETA ~{time}",paused:"paused (prompt running)",stalled_restarted:"{count} download retry",stalled_restarted_p:"{count} download retries",later:"+{size} later",

  profile_label:"Profile",
  select_profile:"Select Profile",
  wake_btn:"Wake",retry_btn:"Retry",starting_btn:"Starting…",
  stop_btn:"Stop · release GPU",stop_confirm:"Stop and release the GPU?",
  dock_confirm:"Confirm stop?",dock_stopping:"Stopping…",
  console_title:"Console",lines:"{count} lines",
  cu_today:"CU TODAY",cu_month:"MONTH",cu_balance:"BALANCE",
  footer:"shared session · GPU sleeps when idle",
  workflows_count:"{count} workflows",reconnecting:"Reconnecting…"
 },
 zh:{
  title:"Comfy Colab Kit",
  sleeping_title:"ComfyUI 休眠中",
  sleeping_sub:"GPU 已释放，当前无算力消耗。点击唤醒开始共享会话。",
  sleeping_last_stop:"上次停机：{reason}。GPU 已释放，无算力消耗。",
  waking_title:"正在唤醒…",
  ready_title:"已就绪 — 正在打开 ComfyUI",
  ready_sub:"正在跳转至 App 模式…",
  failed_title:"启动失败",
  stopping_title:"正在释放 GPU…",
  switching_title:"正在切换预设…",
  elapsed:"已运行 {time}",
  badge_sleeping:"休眠中",badge_ready:"就绪",badge_failed:"失败",badge_stopping:"正在停机",badge_switching:"正在切换",badge_waking:"唤醒中",
  online:"{count} 人在线",
  stage_allocating:"分配 GPU 算力",stage_installing:"安装运行时与依赖",stage_downloading:"下载核心模型",stage_booting:"启动 ComfyUI",stage_smoke_testing:"冒烟出图验证",
  overall:"总体进度",eta:"预计剩余 ~{time}",paused:"已暂停 (正在出图)",stalled_restarted:"网络重试中 ({count}次)",stalled_restarted_p:"网络重试中 ({count}次)",later:"另有 +{size} 后续拉取",
  info_allocating:"正在分配 Colab GPU 算力实例…",info_installing:"正在安装 ComfyUI 运行环境与核心依赖…",info_booting:"正在启动 ComfyUI 引擎与载入模型组件…",info_smoke:"正在执行冒烟出图验证…",
  profile_label:"运行预设 (Profile)",
  select_profile:"选择运行预设",
  wake_btn:"唤醒",retry_btn:"重试",starting_btn:"启动中…",
  stop_btn:"关机 · 释放 GPU",stop_confirm:"确定要停机并释放 GPU 吗？",
  dock_confirm:"确认关机?",dock_stopping:"停机中…",
  console_title:"控制台日志",lines:"{count} 行",
  cu_today:"今日 CU",cu_month:"本月 CU",cu_balance:"CU 余额",
  footer:"全局共享会话 · 空闲自动休眠释放算力",
  workflows_count:"{count} 个工作流",reconnecting:"正在重新连接…"
 }
};

let lang=localStorage.getItem("kit.lang")||(navigator.language.startsWith("zh")?"zh":"en");
function t(k,p={}){let s=(I18N[lang]&&I18N[lang][k])||I18N.en[k]||k;for(const[x,v] of Object.entries(p))s=s.replace(`{${x}}`,v);return s}

const STAGES_KEYS=[["allocating","stage_allocating",20],["installing","stage_installing",60],["downloading","stage_downloading",0],["booting","stage_booting",40],["smoke_testing","stage_smoke_testing",15]];
const BOOT=STAGES_KEYS.map(s=>s[0]);

let cid=sessionStorage.getItem("kit.client_id");
if(!cid){cid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem("kit.client_id",cid)}

let S=null,profiles=[],lines=0,stageT={},lastSt=null,selectedProfileId="";

// Initial SSR-like data injection if present
if(window.__INIT__){
 S=window.__INIT__.status;
 if(window.__INIT__.profiles&&window.__INIT__.profiles.profiles){
  profiles=window.__INIT__.profiles.profiles;
  selectedProfileId=S.profile||window.__INIT__.profiles.default||(profiles[0]&&profiles[0].id)||"";
 }
 if(window.__INIT__.logs&&Array.isArray(window.__INIT__.logs)&&window.__INIT__.logs.length){
  const p=$("log");
  p.textContent=window.__INIT__.logs.join("\n")+"\n";
  lines=window.__INIT__.logs.length;
  $("lcount").textContent=t("lines",{count:lines});
  p.scrollTop=p.scrollHeight;
 }
}

const root=document.documentElement;
window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener("change",(e)=>{
 if(!localStorage.getItem("kit.theme")){
  root.dataset.theme=e.matches?"dark":"light";
  window.kitBg&&kitBg.set({});
 }
});
$("theme").onclick=()=>{const n=root.dataset.theme==="dark"?"light":"dark";root.dataset.theme=n;localStorage.setItem("kit.theme",n);window.kitBg&&kitBg.set({})};

// Language Dropdown Menu Implementation
const langBtn=$("lang-btn"),langPopover=$("lang-popover"),langDropdown=$("lang-dropdown");
let langOpen=false;
function toggleLangMenu(force){
 langOpen=force!==undefined?force:!langOpen;
 if(langOpen&&selectOpen)toggleSelect(false);
 langPopover.classList.toggle("open",langOpen);
 langDropdown.classList.toggle("lang-open",langOpen);
 langBtn.setAttribute("aria-expanded",langOpen);
}
function setLanguage(l){
 lang=l;
 localStorage.setItem("kit.lang",lang);
 updateLanguageUI();
 render();
 renderCustomSelect();
}
function updateLanguageUI(){
 $("ltext").textContent=lang==="zh"?"简体中文":"English";
 $("opt-lang-zh").classList.toggle("active",lang==="zh");
 $("opt-lang-en").classList.toggle("active",lang==="en");
}
langBtn.onclick=(e)=>{e.stopPropagation();toggleLangMenu()};
$("opt-lang-zh").onclick=(e)=>{e.stopPropagation();setLanguage("zh");toggleLangMenu(false)};
$("opt-lang-en").onclick=(e)=>{e.stopPropagation();setLanguage("en");toggleLangMenu(false)};
updateLanguageUI();

const card=$("card");card.addEventListener("pointermove",e=>{const r=card.getBoundingClientRect();card.style.setProperty("--mx",e.clientX-r.left+"px");card.style.setProperty("--my",e.clientY-r.top+"px")});
async function api(p,o){const r=await fetch(p,Object.assign({headers:{"Content-Type":"application/json"}},o));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||r.status);return j}
function fmt(s){s=Math.max(0,Math.round(s));return s>=3600?`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`:s>=60?`${Math.floor(s/60)}m ${s%60}s`:`${s}s`}
function dlp(d){if(!d)return null;const G=1e9;
 if(d.core_bytes_total!=null||d.bytes_total!=null){const core=d.core_bytes_total>0;
  return{done:core?d.core_bytes_done:d.bytes_done,total:core?d.core_bytes_total:d.bytes_total,rate:d.bytes_per_s||0,
   eta:d.eta_s!=null&&!core?d.eta_s:(d.bytes_per_s>0?((core?d.core_bytes_total-d.core_bytes_done:d.bytes_total-d.bytes_done)/d.bytes_per_s):null),
   paused:!!d.paused,restarts:d.restarts||0,files:`${d.files_done}/${d.files_total}`,files_done:d.files_done,files_total:d.files_total,core_done:!!d.core_done,bg:core&&d.bytes_total>d.core_bytes_total?d.bytes_total-d.core_bytes_total:0}}
 if(!d.total_gb)return null;return{done:d.done_gb*G,total:d.total_gb*G,rate:(d.gbps||0)*G,eta:d.gbps>0?(d.total_gb-d.done_gb)/d.gbps:null,paused:false,restarts:0,files:`${d.files_done}/${d.files_total}`,files_done:d.files_done,files_total:d.files_total,core_done:false,bg:0}}
function formatBytes(b){
 if(b==null||isNaN(b)||b<=0)return"0 B";
 if(b<1e6)return`${(b/1e3).toFixed(1)} KB`;
 if(b<1e9)return`${(b/1e6).toFixed(1)} MB`;
 return`${(b/1e9).toFixed(b>=1e10?1:2)} GB`;
}
const gb=b=>formatBytes(b);

// Custom Select Implementation
const profTrigger=$("prof-trigger"),profPopover=$("prof-popover"),profItems=$("prof-items"),customSelect=$("custom-select"),profLabel=$("plabel-txt");
let selectOpen=false;
function toggleSelect(force){
 selectOpen=force!==undefined?force:!selectOpen;
 if(selectOpen&&langOpen)toggleLangMenu(false);
 profPopover.classList.toggle("open",selectOpen);
 customSelect.classList.toggle("sel-open",selectOpen);
 profTrigger.setAttribute("aria-expanded",selectOpen);
}
profTrigger.onclick=(e)=>{e.stopPropagation();toggleSelect()};
// The "Profile" caption doubles as a tap target for opening the picker.
profLabel.onclick=(e)=>{e.stopPropagation();toggleSelect()};
$("pop-close").onclick=(e)=>{e.stopPropagation();toggleSelect(false)};

// Universal outside-click and escape handling
document.addEventListener("pointerdown",e=>{
 const inWidget=(t)=>t instanceof Node&&(customSelect.contains(t)||(profLabel&&profLabel.contains(t)));
 if(selectOpen&&(!e.target||!inWidget(e.target)))toggleSelect(false);
 if(langOpen&&(!e.target||(e.target instanceof Node&&!langDropdown.contains(e.target))))toggleLangMenu(false);
});
window.addEventListener("keydown",e=>{
 if(e.key==="Escape"){toggleSelect(false);toggleLangMenu(false)}
});

function renderCustomSelect(){
 if(!profiles.length)return;
 const cur=profiles.find(x=>x.id===selectedProfileId)||profiles[0];
 selectedProfileId=cur.id;
 $("profile").value=cur.id;
 $("sel-title").textContent=cur.title;
 $("sel-desc").textContent=`${t("workflows_count",{count:cur.workflows.filter(w=>!w.optional).length})} · ~${cur.size_gb_default} GB · ${cur.accelerator}`;
 $("plabel-txt").textContent=t("profile_label");
 $("pop-title").textContent=t("select_profile");
 if($("hprof"))$("hprof").textContent=cur.id;

 profItems.innerHTML="";
 for(const p of profiles){
  const item=document.createElement("div");
  item.className="sel-item"+(p.id===cur.id?" active":"");
  item.setAttribute("role","option");
  item.setAttribute("aria-selected",p.id===cur.id);
  item.innerHTML=`
   <div class="sel-info">
     <span class="sel-title">${p.title}</span>
     <span class="sel-desc">${t("workflows_count",{count:p.workflows.filter(w=>!w.optional).length})} · ~${p.size_gb_default} GB · ${p.accelerator}</span>
   </div>
   <svg class="sel-item-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  `;
  item.onclick=(e)=>{
   e.stopPropagation();
   selectedProfileId=p.id;
   toggleSelect(false);
   renderCustomSelect();
  };
  profItems.appendChild(item);
 }
}

const SVG_ZAP=`<svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;
const SVG_ROTATE=`<svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>`;
const SVG_SPIN=`<svg class="btn-icon spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>`;

function formatReason(r){
 if(!r)return"";
 if(lang==="zh"){
  if(r==="stopped by agent")return"空闲自动释放";
  if(r==="stopped by user")return"手动关机";
  if(r.startsWith("idle timeout"))return"超时休眠";
  if(r.startsWith("budget exceeded"))return"算力超额";
 }
 return r;
}

function render(){
 if(!S)return;
 const serverNow = S.server_time ? S.server_time + ((Date.now() - (render.lastSyncTime || Date.now())) / 1000) : (Date.now() / 1000);
 const st=S.state,waking=BOOT.includes(st)||st==="switching",now=serverNow;
 if(st!==lastSt){stageT[st]=now;lastSt=st;window.kitBg&&kitBg.set({amp:waking?1.6:1})}
 const cls=st==="ready"?"ready":st==="failed"?"failed":waking||st==="stopping"?"waking":"";
 $("badge").className="badge "+cls;
 $("btext").textContent={sleeping:t("badge_sleeping"),ready:t("badge_ready"),failed:t("badge_failed"),stopping:t("badge_stopping"),switching:t("badge_switching")}[st]||t("badge_waking");
 const curP=(S.state==="ready"||S.state==="switching"||BOOT.includes(S.state))?(S.profile||selectedProfileId):(selectedProfileId||S.profile);
 $("hprof").hidden=!curP;$("hprof").textContent=curP||"";
 $("vcount").textContent=t("online",{count:S.clients||1});
 $("title").textContent=st==="sleeping"?t("sleeping_title"):st==="ready"?t("ready_title"):st==="failed"?t("failed_title"):st==="stopping"?t("stopping_title"):st==="switching"?t("switching_title"):t("waking_title");
 const started=S.session_started||S.since;
 $("sub").textContent=st==="sleeping"?(S.reason?t("sleeping_last_stop",{reason:formatReason(S.reason)}):t("sleeping_sub")):st==="failed"?(S.reason||""):waking?t("elapsed",{time:fmt(now-started)}):st==="ready"?t("ready_sub"):"";
 $("con-title").textContent=t("console_title");
 $("footer-txt").textContent=t("footer");

 const stages = (S && S.enable_smoke_test === false) ? STAGES_KEYS.filter(s => s[0] !== "smoke_testing") : STAGES_KEYS;
 const bootKeys = stages.map(s => s[0]);
 const ol=$("stages");ol.hidden=!waking;const ci=bootKeys.indexOf(st);const d=dlp(S.progress&&S.progress.download);
 const durs=(S&&S.stage_durations)||{};
 // Rebuild the list only when its shape changes; refresh the per-stage timers in place
 // so a 1s tick never blows away text selection or focus.
 const sig=bootKeys.join(",")+"|"+ci+"|"+lang;
 if(render.stageSig!==sig){
  ol.innerHTML="";render.stageTimes=[];
  stages.forEach(([k,lKey],i)=>{
   const li=document.createElement("li");li.className=i<ci?"done":i===ci?"cur":"";
   li.innerHTML=`<span class="k">${i<ci?"✓":""}</span><span>${t(lKey)}</span><span class="t"></span>`;
   ol.appendChild(li);render.stageTimes.push(li.querySelector(".t"));
  });
  render.stageSig=sig;
 }
 stages.forEach(([k,lKey],i)=>{
  let tStr="";
  const sd=durs[k];
  if(i<ci){
   if(sd&&sd.duration!=null)tStr=`${sd.duration}s`;
   else if(sd&&sd.elapsed!=null)tStr=`${sd.elapsed}s`;
   else if(sd&&sd.start)tStr=fmt(now-sd.start);
  }else if(i===ci){
   const startT=(sd&&sd.start)||stageT[k]||now;
   tStr=fmt(Math.max(1, now-startT));
  }
  if(k==="downloading"&&d&&d.total&&i<=ci){
   const dlPct=(d.files_done!=null&&d.files_total!=null&&d.files_done<d.files_total)?Math.min(99,Math.floor(100*d.done/d.total)):Math.min(100,Math.round(100*d.done/d.total));
   tStr=(tStr?tStr+" · ":"")+`${dlPct}%`+(d.paused?` · ${t("paused")}`:"");
  }
  if(render.stageTimes[i])render.stageTimes[i].textContent=tStr;
 });

 $("prog").hidden=!waking;
 if(waking&&ci>=0){
  const BRACKETS={
   allocating:[0,12],
   installing:[12,28],
   downloading:[28,88],
   booting:[88,(S&&S.enable_smoke_test===false)?99:97],
   smoke_testing:[97,99.5]
  };
  const [bStart,bEnd]=BRACKETS[st]||[0,99];
  const bSpan=bEnd-bStart;
  let frac=0;
  const sd=durs[st];
  const elapsed=sd&&sd.start?(now-sd.start):(now-(stageT[st]||now));
  if(st==="downloading"&&d&&d.total){
   frac=Math.min(1,Math.max(0,d.done/d.total));
  }else if(st==="allocating"){
   frac=Math.min(0.95,elapsed/15);
  }else if(st==="installing"){
   frac=Math.min(0.95,elapsed/35);
  }else if(st==="booting"){
   frac=Math.min(0.95,elapsed/30);
  }else if(st==="smoke_testing"){
   frac=Math.min(0.95,elapsed/25);
  }
  const curStagePct=bStart+frac*bSpan;
  if(render.maxPct==null)render.maxPct=0;
  render.maxPct=Math.max(render.maxPct,bStart,curStagePct);
  const pct=Math.min(99.5,render.maxPct);
  $("pbar").style.width=pct.toFixed(1)+"%";
  $("plabel").textContent=`${Math.floor(pct)}%`;

  let eta=null;
  if(st==="downloading"&&d&&d.eta!=null){
   let dEta=d.eta;
   if(d.total>0&&(d.done/d.total)>0.8){
    dEta=Math.min(dEta,90);
   }
   eta=dEta+25;
  }else if(st==="allocating"){
   eta=Math.max(15,360-Math.round(now-started));
  }else if(st==="installing"){
   eta=Math.max(10,340-Math.round(now-started));
  }else if(st==="booting"){
   eta=Math.max(5,30-Math.round(elapsed));
  }else{
   eta=Math.max(5,15);
  }
  $("eta").textContent=t("eta",{time:fmt(eta)});

  if(st==="downloading"&&d&&d.total){
   const parts=[`${formatBytes(d.done)} / ${formatBytes(d.total)}`];
   if(d.files)parts.push(d.files);
   if(d.rate>0)parts.push(`${(d.rate/1e6).toFixed(1)} MB/s`);
   if(d.paused)parts.push(t("paused"));
   if(d.restarts>0)parts.push(t(d.restarts>1?"stalled_restarted_p":"stalled_restarted",{count:d.restarts}));
   if(d.bg>0)parts.push(t("later",{size:formatBytes(d.bg)}));
   $("pdl").textContent=parts.join(" · ");
  }else if(st==="installing"){
   if(d&&d.done>1e7){
    $("pdl").textContent=`${t("info_installing")} (${formatBytes(d.done)} / ${formatBytes(d.total)})`;
   }else{
    $("pdl").textContent=t("info_installing");
   }
  }else if(st==="allocating"){
   $("pdl").textContent=t("info_allocating");
  }else if(st==="booting"){
   $("pdl").textContent=t("info_booting");
  }else if(st==="smoke_testing"){
   $("pdl").textContent=t("info_smoke");
  }else{
   $("pdl").textContent="";
  }
 }else{
  render.maxPct=0;
  if(st==="ready"){
   $("pbar").style.width="100%";
   $("plabel").textContent="100%";
  }
 }

 $("pick").hidden=!(st==="sleeping"||st==="failed");
 const w=$("wake");w.hidden=st==="ready";
 if(st==="failed"){
  w.disabled=false;$("wicon").innerHTML=SVG_ROTATE;$("wtext").textContent=t("retry_btn");
 }else if(st==="sleeping"){
  w.disabled=false;$("wicon").innerHTML=SVG_ZAP;$("wtext").textContent=t("wake_btn");
 }else{
  w.disabled=true;$("wicon").innerHTML=SVG_SPIN;$("wtext").textContent=t("starting_btn");
 }

 const stopBtn=$("stop");
 stopBtn.hidden=!(S.you&&S.you.owner&&st!=="sleeping"&&st!=="stopping");
 stopBtn.textContent=t("stop_btn");

 const cu=S.cu||{};
 const cuHtml=`
  <div><small>${t("cu_today")}</small><b>${(cu.today||0).toFixed(2)}</b></div>
  <div><small>${t("cu_month")}</small><b>${(cu.month||0).toFixed(1)}</b></div>
  <div><small>${t("cu_balance")}</small><b>${cu.balance!=null?cu.balance.toFixed(1):"—"}</b></div>
 `;
 if(render.cuHtml!==cuHtml){$("meta").innerHTML=cuHtml;render.cuHtml=cuHtml}
 document.title=st==="sleeping"?t("title"):`${st==="ready"?t("ready_title"):st==="failed"?t("failed_title"):t("waking_title")} · ${t("title")}`;

 const frame=$("comfy-frame"),dock=$("gate-dock");
 if(st==="ready"){
  if(!render.readyMounted){
   render.readyMounted=true;
   card.classList.add("out");
   setTimeout(()=>{
    card.style.display="none";
    const h=document.querySelector("header"),f=$("footer-txt"),b=$("bg"),g=document.querySelector(".grid");
    if(h)h.style.display="none";if(f)f.style.display="none";if(b)b.style.display="none";if(g)g.style.display="none";
   },350);
  }else{
   card.style.display="none";
   const h=document.querySelector("header"),f=$("footer-txt"),b=$("bg"),g=document.querySelector(".grid");
   if(h)h.style.display="none";if(f)f.style.display="none";if(b)b.style.display="none";if(g)g.style.display="none";
  }
  const targetUrl=S.backend_url||"https://comfy-colab.firetable.tech";
  if(!frame.src||frame.src==="about:blank"||!frame.src.startsWith(targetUrl)){
   frame.src=targetUrl;
  }
  frame.style.display="block";
  dock.style.display="flex";

  $("dock-time").textContent=fmt(Math.max(0,now-started));
  $("dock-cu").textContent=`${(cu.today||0).toFixed(2)} CU`;
  document.title=`ComfyUI · ${curP||"Kit"}`;
 }else{
  render.readyMounted=false;
  card.classList.remove("out");
  card.style.display="";
  const h=document.querySelector("header"),f=$("footer-txt"),b=$("bg"),g=document.querySelector(".grid");
  if(h)h.style.display="";if(f)f.style.display="";if(b)b.style.display="";if(g)g.style.display="";
  if(frame){frame.style.display="none";if(frame.src&&frame.src!=="about:blank")frame.src="about:blank";}
  if(dock){dock.style.display="none";}
 }
}

function log(l){const p=$("log");p.textContent+=l+"\n";lines++;$("lcount").textContent=t("lines",{count:lines});if(p.textContent.length>60000)p.textContent=p.textContent.slice(-40000);p.scrollTop=p.scrollHeight}

async function loadProfiles(){
 try{
  if(!profiles.length){
   const j=await api("/_gate/profiles");
   profiles=j.profiles;
   if(!selectedProfileId)selectedProfileId=j.default||(profiles[0]&&profiles[0].id)||"";
  }
  renderCustomSelect();
 }catch(e){console.warn("loadProfiles:",e)}
}

$("wake").onclick=async()=>{
 $("err").textContent="";$("wake").disabled=true;
 $("wicon").innerHTML=SVG_SPIN;$("wtext").textContent=t("starting_btn");
 try{await api("/_gate/wake",{method:"POST",body:JSON.stringify({profile:selectedProfileId})})}
 catch(e){$("err").textContent=e.message;$("wake").disabled=false;$("wicon").innerHTML=SVG_ZAP;$("wtext").textContent=t("wake_btn")}
};

$("stop").onclick=async()=>{
 if(!confirm(t("stop_confirm")))return;
 try{await api("/_gate/stop",{method:"POST"})}catch(e){$("err").textContent=e.message}
};

let dockConfirmTimer=null;
function resetDockStop(){
 if(dockConfirmTimer){clearTimeout(dockConfirmTimer);dockConfirmTimer=null;}
 const btn=$("dock-stop"),txt=$("dock-stop-txt");
 if(btn){btn.classList.remove("confirming");btn.disabled=false;}
 if(txt){txt.style.display="none";}
}
$("dock-stop").onclick=async(e)=>{
 e.stopPropagation();
 const btn=$("dock-stop"),txt=$("dock-stop-txt");
 if(!btn.classList.contains("confirming")){
  btn.classList.add("confirming");
  txt.textContent=t("dock_confirm");
  txt.style.display="inline";
  dockConfirmTimer=setTimeout(resetDockStop,4000);
  return;
 }
 if(dockConfirmTimer){clearTimeout(dockConfirmTimer);dockConfirmTimer=null;}
 txt.textContent=t("dock_stopping");
 btn.disabled=true;
 try{await api("/_gate/stop",{method:"POST"})}
 catch(err){alert(err.message);resetDockStop();}
};
document.addEventListener("pointerdown",e=>{
 if(dockConfirmTimer&&!$("dock-stop").contains(e.target))resetDockStop();
});

function connect(){
 const es=new EventSource("/_gate/events?cid="+encodeURIComponent(cid)+"&since="+lines);
 es.addEventListener("state",e=>{const j=JSON.parse(e.data);S=Object.assign({you:S&&S.you,owner_only:S&&S.owner_only},j);render.lastSyncTime=Date.now();render()});
 es.addEventListener("progress",e=>{if(S){S.progress=JSON.parse(e.data);render()}});
 es.addEventListener("log",e=>log(JSON.parse(e.data)));
 es.onerror=()=>{$("sub").textContent=t("reconnecting")}}

// Initial paint (SSR zero-flicker or fallback)
render.lastSyncTime=Date.now();
renderCustomSelect();
render();
loadProfiles();
connect();
setInterval(render,1000);
setInterval(()=>api("/_gate/status?cid="+encodeURIComponent(cid)).then(j=>{S=Object.assign({},S||{},j);render.lastSyncTime=Date.now();render()}).catch(()=>{}),10000);
</script>
</body>
</html>
