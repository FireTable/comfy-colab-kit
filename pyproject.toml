[project]
name = "comfy-colab-kit"
version = "0.1.0"
description = "Wake-on-demand ComfyUI on Google Colab behind a tiny gateway (comfy-gate)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "pyyaml>=6", "pyjwt[crypto]>=2.8", "brotli>=1.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.21"]

[project.scripts]
comfy-gate = "gate.app:main"
ckit = "ckit.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-dir]
gate = "apps/gate"
ckit = "packages/cli"

[tool.setuptools.package-data]
gate = ["web/*", "openapi.yaml"]
