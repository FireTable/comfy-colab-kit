# MOSS-Image profile. Every workflow is an unmodified community/official upstream file (vendored only when
# Apache-2.0/MIT, otherwise fetched by URL at setup). Models are always downloaded from the original repos.
# yaml-language-server: $schema=../../../schemas/profile.schema.json
id: moss-image
title: MOSS-Image (DeBand int8 default · 4-step fast · official quality/layout · edit)
accelerator: L4
comfyui:
  repo: https://github.com/comfyanonymous/ComfyUI
  commit: bc5f880
  args:
  - --preview-method
  - auto
  - --highvram
  - --reserve-vram
  - '0.2'
  settings:
    Comfy.LinkRenderMode: 2
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    CUDA_MODULE_LOADING: LAZY
    TORCH_CUDNN_V8_API: '1'
    TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: '1'
frontend:
  package: comfyui-frontend-package==1.57.1
# One shared base, text encoder and VAE for every workflow (best quality that fits a 24 GB L4 together:
# SFT bf16 10.2 GB + Qwen3.5-9B int8 9.8 GB + VAE 0.3 GB). Upstream workflow JSONs stay unmodified; at install time
# setup.py rewrites any loader widget naming a key below to the file of the mapped model (subgraphs included).
model_aliases:
  moss_image_sft_int8_convrot.safetensors: sft-bf16
  qwen3.5_9b_w4a8_gptq.safetensors: te-int8
  qwen3.5_9b_bf16.safetensors: te-int8
  flux2-vae_small.safetensors: vae
  moss_image_base_int8_convrot.safetensors: base-bf16
