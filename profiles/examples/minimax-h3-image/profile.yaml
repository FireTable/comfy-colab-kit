# MiniMax-H3-Image profile for Colab L4 (24 GB VRAM).
# Workflows are official Comfy-Org templates (MIT, vendored).
# Models: DiT W4A8 (pruned 11.69 GB, rock-solid for 24 GB L4 zero-OOM), Qwen3-VL 32B INT8 (25.28 GB, High-RAM offloaded),
# Qwen3.5 9B GPTQ prompt enhancer (6.84 GB), VAE (1.09 GB). Optional DiT INT8 (19.54 GB) and Text Encoder NVFP4 (14.61 GB).
# yaml-language-server: $schema=../../../packages/schemas/profile.schema.json
id: minimax-h3-image
title: MiniMax-H3-Image (W4A8 fast L4 · Qwen3-VL 32B · T2I & Multi-Ref Edit)
accelerator: L4
comfyui:
  repo: https://github.com/comfyanonymous/ComfyUI
  commit: ede4e5f
  args:
  - --preview-method
  - auto
  - --reserve-vram
  - '1.5'
  settings:
    Comfy.LinkRenderMode: 2
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    CUDA_MODULE_LOADING: LAZY
    TORCH_CUDNN_V8_API: '1'
    TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: '1'
frontend:
  package: comfyui-frontend-package==1.59.1
